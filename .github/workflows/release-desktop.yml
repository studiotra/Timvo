name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend deps
        run: npm ci

      - name: Disable updater artifacts without signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY — disabling updater artifacts"
            node <<'NODE'
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            NODE
          fi

      # Intentionally omit APPLE_* env vars. Empty strings make Tauri attempt
      # codesign and fail. Add them here only after real Apple secrets exist.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', '0.1.0') }}
          releaseName: Timvo Desktop ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          releaseBody: |
            Timvo menu-bar / tray timer (same clock as web + Slack).

            ### Install (macOS)
            - Open the `.dmg` for your chip (Apple Silicon = `aarch64`, Intel = `x86_64`)
            - Drag Timvo to Applications
            - First launch: right-click → Open if Gatekeeper warns (unsigned beta)

            Notarized builds require Apple signing secrets on the repo.
            Auto-update artifacts require `TAURI_SIGNING_PRIVATE_KEY`.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
